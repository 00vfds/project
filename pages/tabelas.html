<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body becolor="white">
    <h1>
        <p align="center">
            Tabelas na Página HTML.
        </p>
    </h1><br>
    <!-- Estas são as TAGS para inserir Tabelas nas páginas HTML -->
     <!-- Inicio da Tabela -->
      <table>
        <!-- Inicio da 1° linha -->
         <TR>
            <!-- Inicio da 1° célula -->
             <TD>
                <!-- Aqui vai o conteúdo da célula -->
             O Texto da 1° Célula
             <!-- Fim da 1° Célula -->
             </TD>
             <!-- Inicio da 2° Célula -->
              <TD>
            O Texto da 2° Célula
            <!-- Fim da 2° Célula -->
              </TD>
            <!-- Fim da 1° Linha -->
         </TR>
         <!-- Inicio da 2° Linha -->
          <TR>
            <!-- Inicio da 1° Célula da 2° Linha -->
             <TD>
            O Texto da 3° Célula
            <!-- Fim da 1° Célula da 2° Linha -->
             </TD>
             <!-- Inicio da 2° Célula da 2° Linha -->
              <TD>
                O Texto da 4° Célula
            <!-- Fim da 2° Célula da 2° Linha -->
              </TD>
            <!-- Fim da 2° Linha -->
          </TR>
          <!-- Fim da Tabela na página HTML -->
      </table>
      <p><br><br>
        <!-- Atributos BORDER, WIDHT, ALING, BGCOLOR,
         BACKGROUND, CELLSPACING, CELLPADDING E BORDERCOLOR da Tabela -->
         <!-- Atributos COLSPAN, ROWSPAN, WIDTH, HEIGHT, ALIGN, VALIGN, BGCOLOR dsa TAGs -->
          <table border = "2" cellspaccing = "2" cellpadding = "10" align = "center">
            <TR>
              <TD colspan = 2> <!-- expanção de duas colunas -->
                O Texto da 1° Célula
              </TD>
              <TD rowspan = 2> <!-- expansão de duas linhas -->
                O Texto da 2° Célula
              </TD>
            </TR>
            <TR>
              <TD>
                O Texto da 3° Célula
              </TD>
              <TD>
                O Texto da 4° Célula
              </TD>
            </TR>
</body>
</html>
